name: Deploy Edge Functions

# Deploys the Supabase Edge Functions from this repo.
#
# Runs only when you press the button — never automatically on a push. Function
# deploys change production behaviour immediately, and this project batches
# those deliberately rather than shipping on every commit.
#
# This costs no Netlify build minutes: GitHub Actions and Netlify are separate.

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Which functions to deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - telegram-intake
          - refresh-prices
          - refresh-fx
          - backup
          - snapshot-net-worth

env:
  PROJECT_REF: wrxqgfbolryveivgdjia

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # verify_jwt is passed explicitly per function rather than left to
      # supabase/config.toml, so the security boundary is visible in the deploy
      # log itself. These values match config.toml — telegram-intake is the one
      # public entry point because Telegram cannot present a Supabase JWT; its
      # authentication is the webhook secret, enforced fail-closed in gate.ts.
      - name: Deploy telegram-intake
        if: ${{ inputs.functions == 'all' || inputs.functions == 'telegram-intake' }}
        run: supabase functions deploy telegram-intake --project-ref "$PROJECT_REF" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy refresh-prices
        if: ${{ inputs.functions == 'all' || inputs.functions == 'refresh-prices' }}
        run: supabase functions deploy refresh-prices --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy refresh-fx
        if: ${{ inputs.functions == 'all' || inputs.functions == 'refresh-fx' }}
        run: supabase functions deploy refresh-fx --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy backup
        if: ${{ inputs.functions == 'all' || inputs.functions == 'backup' }}
        run: supabase functions deploy backup --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # SHR-113 Phase A adds this manual deployment path but does not invoke it.
      # Database apply, function secrets/deploy, and scheduler activation remain
      # separate approval gates.
      - name: Deploy snapshot-net-worth
        if: ${{ inputs.functions == 'all' || inputs.functions == 'snapshot-net-worth' }}
        run: supabase functions deploy snapshot-net-worth --project-ref "$PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
